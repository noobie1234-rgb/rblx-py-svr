
<!DOCTYPE html>
<html>
<head>
    <title>Python Server</title>
</head>
<body>

    <textarea id="textbox"
        placeholder="Type something..."
        style="
            width: 100%;
            max-width: 100%;
            min-height: 50px;
            box-sizing: border-box;
            font-size: 20px;
            resize: none;
            overflow: hidden;
        "></textarea>

    <br><br>

    <button onclick="sendData()"
        style="width:120px; height:55px; font-size:20px;">
        Submit
    </button>

    <p id="response"></p>

    <script>
        const textbox = document.getElementById("textbox");

        textbox.addEventListener("input", function () {

            const characters = textbox.value.length;

            // Increase height every 27 characters
            const lines = Math.max(1, Math.ceil(characters / 27));

            textbox.style.height = (lines * 30 + 20) + "px";
        });

        async function sendData() {
            const text = textbox.value;

            const result = await fetch("/submit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({value: text})
            });

            const data = await result.json();

            document.getElementById("response").innerText =
                JSON.stringify(data);
        }
    </script>

</body>
</html>
